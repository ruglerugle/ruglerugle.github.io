<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ページが見つかりません ― 情報技術クエスト集</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧭</text></svg>">
<style>
  :root{--bg0:#080b16;--bg1:#0d1326;--tp:#f2f0e6;--ts:#b9c0d8;--gold:#f3c96a;}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:linear-gradient(180deg,var(--bg0),var(--bg1) 45%,var(--bg0));
    color:var(--tp);
    font-family:"Hiragino Sans","Yu Gothic",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;
    line-height:1.7;padding:24px;
  }
  h1{color:var(--gold);font-size:28px;margin:0 0 12px}
  p{color:var(--ts);margin:0 0 24px}
  a{
    display:inline-block;color:var(--bg0);background:var(--gold);text-decoration:none;
    font-weight:900;padding:12px 28px;border-radius:999px;
  }
</style>
</head>
<body>
<main>
  <div style="font-size:64px">🗺️</div>
  <h1>404 ― この場所は地図にありません</h1>
  <p>お探しのページは移動したか、存在しないようです。<br>ワールドマップに戻って、クエストを選び直しましょう。</p>
  <a href="/">🧭 ワールドマップへ戻る</a>
</main>
</body>
</html>
